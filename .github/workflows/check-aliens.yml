name: Check aliens.gov

on:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-aliens
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run check
        run: python check_aliens.py

      - name: Notify on change
        if: hashFiles('changed.txt') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC secret is not set; skipping notification."
            exit 0
          fi
          curl -sS \
            -H "Title: aliens.gov changed" \
            -H "Priority: high" \
            -H "Tags: alien,warning" \
            -d "$(cat changed.txt)" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Notify on error
        if: hashFiles('error.txt') != ''
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC secret is not set; skipping notification."
            exit 0
          fi
          curl -sS \
            -H "Title: aliens.gov check failed" \
            -H "Priority: default" \
            -H "Tags: warning" \
            -d "$(cat error.txt)" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_status.txt last_hash.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update aliens.gov check state [skip ci]"
            git push
          fi
